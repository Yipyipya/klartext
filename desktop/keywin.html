<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    padding: 28px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0c100e;
    color: #edf3ef;
  }
  .eyebrow { margin: 0 0 8px; color: #2dd4bf; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 22px; letter-spacing: -.04em; margin: 0 0 8px; }
  p { font-size: 12px; color: #829087; margin: 0 0 18px; line-height: 1.55; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 13px;
    border: 1px solid rgba(237,243,239,.14);
    border-radius: 12px;
    outline: none;
    color: #edf3ef;
    background: #121816;
  }
  input:focus { border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45,212,191,.14); }
  .row { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  button {
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(237,243,239,.14);
    border-radius: 999px;
    cursor: pointer;
    color: #c5d0ca;
    background: #121816;
  }
  button.primary { color: white; border-color: transparent; background: linear-gradient(#ff8058, #f05e36); }
  button.danger { background: transparent; border-color: transparent; color: #829087; }
</style>
</head>
<body>
  <div class="eyebrow">Beste Qualität</div>
  <h1>OpenAI verbinden</h1>
  <p>
    Trage deinen OpenAI API-Key ein. Er wird verschlüsselt im Schlüsselbund
    beziehungsweise Windows Credential Vault gespeichert und ausschließlich
    für deine Transkriptionen direkt an OpenAI gesendet.
  </p>
  <input id="key" type="password" placeholder="sk-proj-…" autocomplete="off" autofocus />
  <div class="row">
    <button class="danger" id="remove">Key entfernen</button>
    <button id="cancel">Abbrechen</button>
    <button class="primary" id="save">Speichern</button>
  </div>
<script>
  const input = document.getElementById("key");
  document.getElementById("save").addEventListener("click", () => {
    if (input.value.trim()) window.klartext.saveApiKey(input.value);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) window.klartext.saveApiKey(input.value);
  });
  document.getElementById("remove").addEventListener("click", () => window.klartext.saveApiKey(""));
  document.getElementById("cancel").addEventListener("click", () => window.klartext.closeKeyWindow());
</script>
</body>
</html>
