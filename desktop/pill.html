<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="resonanz.css">
<style>
:root{color-scheme:light}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:12px 10px}
#preview{display:none;max-width:480px;max-height:110px;overflow:hidden;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 17px;font-size:14px;line-height:1.6;box-shadow:0 8px 24px #15274420}
#preview.visible{display:block}#preview .interim{color:var(--muted)}
#pill{display:flex;align-items:center;gap:13px;background:var(--surface);color:var(--ink);border:1px solid var(--strong);border-radius:30px;padding:14px 20px;min-height:57px;box-shadow:0 7px 20px #15274428}
#dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
canvas{width:100px;height:25px;color:var(--accent)}#timer{font:12px ui-monospace,monospace;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#status{font-size:12px;color:var(--muted);max-width:245px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.processing canvas{display:none}.processing #dot{width:17px;height:17px;background:none;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}.processing #timer{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.processing #dot{animation:none}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="preview"></div>
    <div id="pill" role="status" aria-live="polite">
      <span class="voice-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="dot"></span>
      <canvas id="wave"></canvas>
      <span id="timer">0:00</span>
      <span id="status">Aufnahme …</span>
    </div>
  </div>

<script src="audio-runtime.js"></script>
<script src="audio-segments.js"></script>
<script src="whisper-bundle.js"></script>
<script type="module">
  const statusEl = document.getElementById("status");
  const timerEl = document.getElementById("timer");
  const pillEl = document.getElementById("pill");
  const previewEl = document.getElementById("preview");
  const canvas = document.getElementById("wave");

  const SAMPLE_RATE = 16000;
  const LIVE_WINDOW_S = 28;   // Whisper-Fenster für die Live-Vorschau
  const LIVE_MIN_S = 1.2;     // erst ab so viel Audio lostranskribieren

  /* ---------- Whisper laden (einmalig pro Modell, wird gecacht) ---------- */
  const {
    LOCAL_MODELS: MODEL_DEFINITIONS,
    TRANSFORMERS_CACHE_KEY,
    classifyLocalModelCacheFiles,
    isLocalModelCacheUrl,
    revisionAwareModelCache,
    transcribeInWindows,
  } = window.NivuneTransformers;
  const MODELS = {
    genau: MODEL_DEFINITIONS.genau.id,
    schnell: MODEL_DEFINITIONS.schnell.id,
  };
  let currentModelId = MODELS.genau;
  let interfaceLanguage = "de";
  const t = (german, english) => interfaceLanguage === "en" ? english : german;
  let transcriberPromise = null;
  let transcriberReady = false;
  let loadedModelKey = "";
  let loadedBackend = "";
  let activeModelController = null;

  const definitionFor = (modelId) => Object.values(MODEL_DEFINITIONS).find((model) => model.id === modelId) ?? MODEL_DEFINITIONS.genau;
  const keyFor = (model) => `${model.id}@${model.revision}`;

  async function inspectModel(modelId) {
    const model = definitionFor(modelId);
    if (typeof caches === "undefined") return { state: "missing", files: 0 };
    const cache = await caches.open(TRANSFORMERS_CACHE_KEY);
    return classifyLocalModelCacheFiles(
      (await cache.keys()).map((request) => request.url),
      model,
      navigator.gpu ? "webgpu" : "wasm",
    );
  }

  async function releaseTranscriber() {
    const previous = await transcriberPromise?.catch(() => null);
    transcriberPromise = null;
    transcriberReady = false;
    loadedModelKey = "";
    if (previous?.dispose) await previous.dispose();
  }

  async function getTranscriber(modelId, allowDownload = false, commandId = null) {
    const model = definitionFor(modelId);
    const modelKey = keyFor(model);
    if (loadedModelKey && loadedModelKey !== modelKey) {
      activeModelController?.abort();
      await releaseTranscriber();
    }
    if (!transcriberPromise) {
      if (!allowDownload && (await inspectModel(model.id)).state !== "ready") throw new Error("LOCAL_MODEL_NOT_READY");
      loadedModelKey = modelKey;
      transcriberPromise = (async () => {
        const { pipeline, env } = window.NivuneTransformers;
        const resource = (name) => new URL(name, window.location.href).href;
        env.backends.onnx.wasm.wasmPaths = {
          mjs: resource("ort-wasm-simd-threaded.asyncify.mjs"),
          wasm: resource("ort-wasm-simd-threaded.asyncify.wasm"),
        };
        const previousFetch = env.fetch;
        const previousAllowLocalModels = env.allowLocalModels;
        const previousUseCustomCache = env.useCustomCache;
        const previousCustomCache = env.customCache;
        const controller = new AbortController();
        activeModelController = controller;
        if (!allowDownload) env.allowLocalModels = true;
        const compatibleCache = !allowDownload ? await revisionAwareModelCache(model) : null;
        if (compatibleCache) {
          env.useCustomCache = true;
          env.customCache = compatibleCache;
        }
        env.fetch = (input, init = {}) => previousFetch(input, {
          ...init,
          signal: init.signal ? AbortSignal.any([init.signal, controller.signal]) : controller.signal,
        });
        const progress_callback = (p) => {
          if (p.status === "progress_total" || (p.status === "progress" && p.file?.endsWith(".onnx"))) {
            statusEl.textContent = t(`Modell lädt … ${Math.round(p.progress ?? 0)} %`, `Downloading model … ${Math.round(p.progress ?? 0)}%`);
            if (commandId) window.klartext.modelStatus({ id: commandId, choice: model.choice, state: "downloading", progress: Math.round(p.progress ?? 0), loaded: Number(p.loaded || 0), total: Number(p.total || 0) });
          }
        };
        try {
          const common = {
            revision: model.revision,
            local_files_only: !allowDownload,
            ...(allowDownload ? { progress_callback } : {}),
          };
          try {
            if (!navigator.gpu) throw new Error("kein WebGPU");
            const created = await pipeline("automatic-speech-recognition", model.id, {
              ...common,
              device: "webgpu",
              dtype: { encoder_model: "fp32", decoder_model_merged: "q4" },
            });
            loadedBackend = "webgpu";
            return created;
          } catch (error) {
            if (controller.signal.aborted) throw error;
            // Do not restore the shared Transformers environment before the
            // asynchronous WASM fallback has actually loaded from the cache.
            const created = await pipeline("automatic-speech-recognition", model.id, {
              ...common,
              device: "wasm",
              dtype: "q8",
            });
            loadedBackend = "wasm";
            return created;
          }
        } finally {
          env.fetch = previousFetch;
          env.allowLocalModels = previousAllowLocalModels;
          env.useCustomCache = previousUseCustomCache;
          env.customCache = previousCustomCache;
          if (activeModelController === controller) activeModelController = null;
        }
      })().then((created) => {
        transcriberReady = true;
        return created;
      });
      transcriberPromise.catch(() => {
        transcriberPromise = null;
        transcriberReady = false;
        loadedModelKey = "";
        loadedBackend = "";
      });
    }
    return transcriberPromise;
  }

  async function removeModel(modelId) {
    const model = definitionFor(modelId);
    activeModelController?.abort();
    if (loadedModelKey === keyFor(model)) await releaseTranscriber();
    if (typeof caches !== "undefined") {
      const cache = await caches.open(TRANSFORMERS_CACHE_KEY);
      const requests = await cache.keys();
      await Promise.all(requests.filter((request) => isLocalModelCacheUrl(request.url, model)).map((request) => cache.delete(request)));
    }
    return inspectModel(model.id);
  }

  window.klartext.onModelCommand(async (command) => {
    const choice = command?.choice === "schnell" ? "schnell" : "genau";
    const model = MODEL_DEFINITIONS[choice];
    if (command?.action === "cancel") {
      activeModelController?.abort();
      return;
    }
    try {
      if (command?.action === "download") await getTranscriber(model.id, true, command.id);
      const state = command?.action === "remove" ? await removeModel(model.id) : await inspectModel(model.id);
      window.klartext.modelStatus({ id: command?.id, choice, ...state });
    } catch (error) {
      const state = await inspectModel(model.id).catch(() => ({ state: "partial", files: 0 }));
      window.klartext.modelStatus({ id: command?.id, choice, ...state, error: error?.name === "AbortError" ? "MODEL_DOWNLOAD_ABORTED" : String(error?.message ?? error) });
    }
  });

  // Beim Start nur bereits vollständig gecachte Modelle laden. Ein Download
  // beginnt ausschließlich über den sichtbaren Modellmanager.
  window.klartext.onPrepare(async (settings) => {
    interfaceLanguage = settings?.interfaceLanguage === "en" ? "en" : "de";
    document.documentElement.lang = interfaceLanguage;
    try {
      const model = MODEL_DEFINITIONS[settings.model] ?? MODEL_DEFINITIONS.genau;
      if (settings.mode === "local") await getTranscriber(model.id, false);
      window.klartext.prepared({
        ...settings,
        ok: true,
        ...(settings.mode === "local" ? {
          backend: loadedBackend,
          modelId: model.id,
          revision: model.revision,
          localFilesOnly: true,
        } : {}),
      });
    } catch (error) {
      window.klartext.prepared({ ...settings, ok: false, reason: String(error?.message ?? error) });
    }
  });

  const cancelledWorkspaceRequests = new Set();
  const segments = window.nivuneAudioSegments;
  window.klartext.onWorkspaceLocalCancel((requestId) => cancelledWorkspaceRequests.add(String(requestId || "")));

  // Dekodiert Audio- und Videodateien (nur die Tonspur) zu 16-kHz-Mono.
  // Das Original wird danach sofort freigegeben, damit lange Meetings in den
  // Arbeitsspeicher passen.
  async function decodeWorkspaceAudio(request) {
    const bytes = request.bytes instanceof Uint8Array ? request.bytes : new Uint8Array(request.bytes || []);
    if (!bytes.byteLength) throw new Error("AUDIO_FILE_EMPTY");
    const context = new AudioContext({ sampleRate: SAMPLE_RATE });
    try {
      const source = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
      let decoded;
      try {
        decoded = await context.decodeAudioData(source);
      } catch {
        throw new Error("AUDIO_DECODE_FAILED");
      }
      if (!decoded.length || !decoded.numberOfChannels) throw new Error("AUDIO_DECODE_EMPTY");
      if (decoded.duration > segments.MAX_SEGMENTED_SECONDS) throw new Error("AUDIO_TOO_LONG");
      const channels = Array.from({ length: decoded.numberOfChannels }, (_, index) => decoded.getChannelData(index));
      return { samples: segments.mixToMono(channels), durationMs: Math.round(decoded.duration * 1000) };
    } finally {
      context.close().catch(() => {});
    }
  }

  window.klartext.onWorkspaceLocalTranscribe(async (request) => {
    const requestId = String(request?.requestId || "");
    if (!requestId) return;
    try {
      const { samples } = await decodeWorkspaceAudio(request);
      if (cancelledWorkspaceRequests.has(requestId)) return;
      const transcriber = await getTranscriber(request.model, false);
      // Fortschritt und Absätze in 5-Minuten-Abschnitten; innerhalb davon
      // eigene Whisper-Fenster unter 30 Sekunden (siehe shared/whisper-windows.ts).
      const ranges = segments.splitRanges(samples, SAMPLE_RATE, segments.LOCAL_SEGMENT_SECONDS * SAMPLE_RATE);
      const texts = [];
      for (const [index, range] of ranges.entries()) {
        if (cancelledWorkspaceRequests.has(requestId)) return;
        if (ranges.length > 1) window.klartext.workspaceLocalProgress({ requestId, current: index + 1, total: ranges.length });
        const text = await transcribeInWindows(transcriber, samples.subarray(range.start, range.end), SAMPLE_RATE, {
          language: request.language || undefined,
        }, { shouldStop: () => cancelledWorkspaceRequests.has(requestId) });
        if (text) texts.push(text);
      }
      if (cancelledWorkspaceRequests.has(requestId)) return;
      window.klartext.workspaceLocalResult({ requestId, text: texts.join(ranges.length > 1 ? "\n\n" : " ").trim() });
    } catch (error) {
      if (!cancelledWorkspaceRequests.has(requestId)) {
        window.klartext.workspaceLocalResult({ requestId, error: String(error?.message || error) });
      }
    } finally {
      cancelledWorkspaceRequests.delete(requestId);
    }
  });

  // Für Cloud-Anbieter: lange Dateien in WAV-Abschnitte unter der Anbietergrenze
  // teilen. Abschnitte werden einzeln an den Main-Prozess gesendet.
  window.klartext.onWorkspaceAudioSegments(async (request) => {
    const requestId = String(request?.requestId || "");
    if (!requestId) return;
    try {
      const maxBytes = Number(request.maxBytes);
      const { samples, durationMs } = await decodeWorkspaceAudio(request);
      const ranges = segments.splitRanges(samples, SAMPLE_RATE, segments.maxSamplesForBytes(maxBytes));
      for (const [index, range] of ranges.entries()) {
        if (cancelledWorkspaceRequests.has(requestId)) return;
        window.klartext.workspaceAudioSegment({
          requestId,
          index,
          total: ranges.length,
          durationMs,
          wav: new Uint8Array(segments.encodeWavMono(samples, SAMPLE_RATE, range)),
        });
      }
    } catch (error) {
      if (!cancelledWorkspaceRequests.has(requestId)) {
        window.klartext.workspaceAudioSegment({ requestId, error: String(error?.message || error) });
      }
    } finally {
      cancelledWorkspaceRequests.delete(requestId);
    }
  });

  /* ---------- Zustand ---------- */
  let stream = null, actx = null, procNode = null;
  let pcmChunks = [];        // Float32Array-Stücke mit 16 kHz mono
  let totalSamples = 0;
  let silenceMonitor = null;
  let recordingActive = false, cancelled = false, currentLang = "de";
  let currentMode = "quality", hasOpenAIKey = false, lastPreviewText = "";
  let startedAt = 0, timerIv = 0, raf = 0, liveIv = 0, liveBusy = false;
  let generation = 0;

  function concatPcm(fromSample = 0) {
    const out = new Float32Array(totalSamples - fromSample);
    let pos = 0, skipped = 0;
    for (const c of pcmChunks) {
      if (skipped + c.length <= fromSample) { skipped += c.length; continue; }
      const start = Math.max(0, fromSample - skipped);
      out.set(start ? c.subarray(start) : c, pos);
      pos += c.length - start;
      skipped += c.length;
    }
    return out;
  }

  function drawWave(analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const bars = 24;
    const loop = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      analyser.getByteFrequencyData(data);
      ctx.fillStyle = getComputedStyle(canvas).color;
      const gap = 3, bw = Math.max(2, (w - gap * (bars - 1)) / bars);
      for (let i = 0; i < bars; i++) {
        const v = data[Math.floor((i / bars) * data.length * 0.7)] / 255;
        const bh = Math.max(3, v * h);
        ctx.beginPath();
        ctx.roundRect(i * (bw + gap), (h - bh) / 2, bw, bh, bw / 2);
        ctx.fill();
      }
      raf = requestAnimationFrame(loop);
    };
    loop();
  }

  function setPreview(text, truncated) {
    if (!text) {
      previewEl.classList.remove("visible");
      previewEl.innerHTML = "";
      return;
    }
    previewEl.classList.add("visible");
    lastPreviewText = text;
    previewEl.innerHTML = "";
    const span = document.createElement("span");
    span.className = "interim";
    span.textContent = (truncated ? "… " : "") + text;
    previewEl.appendChild(span);
    previewEl.scrollTop = previewEl.scrollHeight;
  }

  function resetUI() {
    cancelAnimationFrame(raf);
    clearInterval(timerIv);
    clearInterval(liveIv);
    timerEl.textContent = "0:00";
    statusEl.textContent = t("Aufnahme …", "Recording …");
    pillEl.classList.remove("processing");
    setPreview("");
  }

  function encodeWav(pcm) {
    const buffer = new ArrayBuffer(44 + pcm.length * 2);
    const view = new DataView(buffer);
    const write = (offset, value) => {
      for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
    };
    write(0, "RIFF");
    view.setUint32(4, 36 + pcm.length * 2, true);
    write(8, "WAVE");
    write(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, SAMPLE_RATE, true);
    view.setUint32(28, SAMPLE_RATE * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    write(36, "data");
    view.setUint32(40, pcm.length * 2, true);
    let offset = 44;
    for (let i = 0; i < pcm.length; i++, offset += 2) {
      const sample = Math.max(-1, Math.min(1, pcm[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
    }
    return buffer;
  }

  function stopCapture() {
    procNode?.disconnect();
    procNode = null;
    stream?.getTracks().forEach((t) => t.stop());
    stream = null;
    actx?.close().catch(() => {});
    actx = null;
  }

  /* ---------- Live-Vorschau: alle 1,5 s den Puffer transkribieren ---------- */
  async function liveTick() {
    if (currentMode !== "local" || liveBusy || !recordingActive || !transcriberReady) return;
    if (totalSamples < SAMPLE_RATE * LIVE_MIN_S) return;
    liveBusy = true;
    try {
      const windowSamples = SAMPLE_RATE * LIVE_WINDOW_S;
      const truncated = totalSamples > windowSamples;
      const pcm = concatPcm(truncated ? totalSamples - windowSamples : 0);
      const t = await getTranscriber(currentModelId);
      const out = await t(pcm, {
        language: currentLang || undefined,
        task: "transcribe",
      });
      const text = (Array.isArray(out) ? out.map((o) => o.text).join(" ") : out.text) ?? "";
      if (recordingActive) setPreview(text.trim(), truncated);
    } catch {
      /* Vorschau-Durchlauf fehlgeschlagen – nächster Tick versucht es erneut */
    } finally {
      liveBusy = false;
    }
  }

  /* ---------- Start / Stopp / Abbrechen ---------- */
  window.klartext.onStart(async (settings) => {
    const session = ++generation;
    cancelled = false;
    recordingActive = true;
    pcmChunks = [];
    totalSamples = 0;
    let limitReported = false;
    silenceMonitor = window.NivuneAudioRuntime.createSilenceMonitor();
    currentLang = settings?.lang ?? "de";
    interfaceLanguage = settings?.interfaceLanguage === "en" ? "en" : "de";
    document.documentElement.lang = interfaceLanguage;
    currentMode = settings?.mode ?? "quality";
    hasOpenAIKey = Boolean(settings?.hasOpenAIKey);
    lastPreviewText = "";
    currentModelId = MODELS[settings?.model] ?? MODELS.genau;
    resetUI();

    try {
      const requestedStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (session !== generation || !recordingActive || cancelled) {
        requestedStream.getTracks().forEach((track) => track.stop());
        return;
      }
      stream = requestedStream;
    } catch (error) {
      recordingActive = false;
      window.klartext.error(error?.name === "NotAllowedError"
        ? t("Kein Mikrofonzugriff. Bitte die Mikrofonberechtigung für Nivune erlauben.", "No microphone access. Please allow microphone permission for Nivune.")
        : t(`Mikrofon konnte nicht geöffnet werden: ${error?.message || "unbekannter Fehler"}`, `The microphone could not be opened: ${error?.message || "unknown error"}`));
      return;
    }

    try {
      // Direkt als 16-kHz-PCM aufnehmen. AudioContext kann in einem unsichtbaren
      // Hintergrundfenster zunächst pausiert sein, deshalb explizit aktivieren.
      actx = new AudioContext({ sampleRate: SAMPLE_RATE });
      await window.NivuneAudioRuntime.ensureAudioContextRunning(actx);
      const src = actx.createMediaStreamSource(stream);
      const analyser = actx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.75;
      src.connect(analyser);

      procNode = actx.createScriptProcessor(4096, 1, 1);
      procNode.onaudioprocess = (e) => {
        if (!recordingActive) return;
        const input = e.inputBuffer.getChannelData(0);
        const remaining = window.NivuneAudioRuntime.MAX_SYSTEM_DICTATION_SAMPLES - totalSamples;
        if (remaining <= 0) {
          if (!limitReported) {
            limitReported = true;
            statusEl.textContent = t("Maximale Diktatdauer erreicht …", "Maximum dictation duration reached …");
            window.klartext.limit();
          }
          return;
        }
        const c = new Float32Array(input.subarray(0, Math.min(input.length, remaining)));
        pcmChunks.push(c);
        totalSamples += c.length;
        let energy = 0;
        for (let index = 0; index < c.length; index += 1) energy += c[index] * c[index];
        silenceMonitor?.observeRms(Math.sqrt(energy / Math.max(1, c.length)));
        if (silenceMonitor?.shouldAutoStop()) window.klartext.silence();
        if (totalSamples >= window.NivuneAudioRuntime.MAX_SYSTEM_DICTATION_SAMPLES && !limitReported) {
          limitReported = true;
          statusEl.textContent = t("Maximale Diktatdauer erreicht …", "Maximum dictation duration reached …");
          window.klartext.limit();
        }
      };
      const mute = actx.createGain();
      mute.gain.value = 0;
      src.connect(procNode);
      procNode.connect(mute);
      mute.connect(actx.destination);

      drawWave(analyser);
      startedAt = Date.now();
      timerIv = setInterval(() => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        timerEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }, 400);
      if (currentMode === "local") {
        liveIv = setInterval(liveTick, 1500);
        getTranscriber(currentModelId).catch(() => {});
      }
    } catch (error) {
      recordingActive = false;
      stopCapture();
      window.klartext.error(t(`Audioaufnahme konnte nicht gestartet werden: ${error?.message || "unbekannter Fehler"}`, `Audio recording could not be started: ${error?.message || "unknown error"}`));
    }
  });

  window.klartext.onProcessingStart(() => {
    pillEl.classList.add("processing");
    statusEl.textContent = t("Transkribiere …", "Transcribing …");
  });

  window.klartext.onRefiningStart(() => {
    pillEl.classList.add("processing");
    statusEl.textContent = t("Text wird geglättet …", "Refining text …");
  });

  window.klartext.onStop(async (options = {}) => {
    if (!recordingActive) return;
    recordingActive = false;
    clearInterval(liveIv);
    cancelAnimationFrame(raf);
    clearInterval(timerIv);
    stopCapture();

    pillEl.classList.add("processing");
    statusEl.textContent = t("Finalisiere …", "Finalizing …");
    try {
      // Laufenden Live-Durchlauf ausklingen lassen
      while (liveBusy) await new Promise((r) => setTimeout(r, 60));
      if (cancelled) return;
      const trimSamples = Math.min(
        totalSamples,
        Math.max(0, Math.floor((Number(options.trimTailMs) || 0) * SAMPLE_RATE / 1000))
      );
      const usableSamples = totalSamples - trimSamples;
      if (usableSamples < SAMPLE_RATE * 0.4) {
        window.klartext.result("");
        return;
      }
      const capturedPcm = concatPcm(0);
      const allPcm = trimSamples ? capturedPcm.subarray(0, usableSamples) : capturedPcm;
      if (currentMode === "quality" && hasOpenAIKey) {
        statusEl.textContent = t("Beste Qualität …", "Best quality …");
        window.klartext.result({
          text: lastPreviewText.trim(),
          audio: encodeWav(allPcm),
          stopReason: options.reason,
        });
      } else {
        const t = await getTranscriber(currentModelId);
        const raw = await transcribeInWindows(t, allPcm, SAMPLE_RATE, { language: currentLang || undefined });
        window.klartext.result({ text: raw.trim(), audio: null, stopReason: options.reason });
      }
    } catch (err) {
      window.klartext.error(String(err?.message ?? err));
    } finally {
      pcmChunks = [];
      totalSamples = 0;
      silenceMonitor = null;
      resetUI();
    }
  });

  window.klartext.onCancel(() => {
    generation++;
    cancelled = true;
    recordingActive = false;
    stopCapture();
    pcmChunks = [];
    totalSamples = 0;
    silenceMonitor = null;
    resetUI();
  });
  window.klartext.ready();
</script>
</body>
</html>
