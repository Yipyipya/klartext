name: Verify builds

on:
  pull_request:
  push:
    branches:
      - develop/v1-core
  workflow_dispatch:
    inputs:
      build_native_packages:
        description: Build unsigned macOS and Windows test packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, web and desktop bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run verify

  package-macos:
    name: macOS package
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_packages
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run dist
      - run: node scripts/create-build-manifest.cjs --output desktop/dist/build-manifest.json desktop/dist/Nivune-Mac-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: nivune-macos-${{ github.sha }}
          path: |
            desktop/dist/Nivune-Mac-AppleSilicon.dmg
            desktop/dist/build-manifest.json
          if-no-files-found: error

  package-windows:
    name: Windows package
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run dist:win
      - run: node scripts/create-build-manifest.cjs --output desktop/dist/build-manifest.json desktop/dist/Nivune-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nivune-windows-${{ github.sha }}
          path: |
            desktop/dist/Nivune-Windows.exe
            desktop/dist/build-manifest.json
          if-no-files-found: error
